[package]
name = "tradutor-libras"
version = "0.3.2"
edition = "2024"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
nokhwa = { version = "=0.10.11", features = ["input-native"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-17"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true

